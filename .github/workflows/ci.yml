name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Covers src/ via tsconfig.json and tests/ + tools/ via tsconfig.test.json.
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end
    # Runs on Windows because the committed Playwright snapshots are
    # <name>-chromium-win32.png; on Linux every screenshot test would fail for
    # want of a matching baseline rather than for a real regression.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
